[project]
name = "pedidos-api"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "ruff>=0.8"]

[project.scripts]
pedidos = "pedidos_api.cli:main"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
